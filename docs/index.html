<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PING</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07080c; color: #f2f4f8; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 360px; }
  h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: 2px; }
  .code { font: 600 28px ui-monospace, monospace; letter-spacing: 4px; margin: 16px 0; }
  a { display: inline-block; padding: 14px 28px; border-radius: 999px; background: #c6ff3a; color: #07080c; font-weight: 700; text-decoration: none; }
  p { color: #9aa3b2; }
</style>
</head>
<body>
<main>
  <h1>PING</h1>
  <p>Someone wants to chat with you privately.</p>
  <div class="code" id="code"></div>
  <a id="open" href="#">Open in PING</a>
  <p>No PING yet? Ask them for the app, then open this link again or type the code.</p>
</main>
<script>
  // Messaging apps only make https links tappable; this page hands the code to the app.
  var code = (/[?&]code=([A-Za-z0-9]{8})/.exec(location.search) || [])[1];
  if (code) {
    var url = 'intent://add?code=' + code + '#Intent;scheme=ping;package=com.kiran.ping;end';
    document.getElementById('code').textContent = code.slice(0, 4) + ' ' + code.slice(4);
    document.getElementById('open').href = url;
    location.href = url;
  } else {
    document.getElementById('open').style.display = 'none';
  }
</script>
</body>
</html>
